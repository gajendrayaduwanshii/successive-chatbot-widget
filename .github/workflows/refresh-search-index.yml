name: Refresh chatbot search index

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request the protected Vercel refresh route
        run: >-
          curl --fail-with-body --retry 2 --retry-delay 5
          --request POST
          --header "Authorization: Bearer $CRON_SECRET"
          https://successive-chatbot-widget.vercel.app/api/internal/refresh-search-index
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
