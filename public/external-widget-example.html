<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Successive AI Chat</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #fff;
        color: #000;
        font-family: Arial, Helvetica, sans-serif;
      }

      .ai-hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 70px 24px;
      }

      .ai-hero__content {
        width: min(100%, 980px);
        text-align: center;
      }

      .ai-hero__title {
        margin: 0;
        font-size: clamp(48px, 6vw, 78px);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.1;
      }

      .ai-hero__description {
        max-width: 880px;
        margin: 30px auto 0;
        color: #3f3f46;
        font-size: 20px;
        line-height: 1.5;
      }

      .ai-prompt {
        width: min(100%, 650px);
        min-height: 74px;
        margin: 60px auto 0;
        padding: 12px 14px 12px 24px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 0 10px 2px rgba(0, 0, 0, 0.18);
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .ai-prompt:focus-within {
        outline: 3px solid rgba(0, 99, 206, 0.25);
        outline-offset: 4px;
      }

      .ai-prompt__sparkle {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        color: #f04b3f;
      }

      .ai-prompt__input {
        width: 100%;
        min-width: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #111;
        font: inherit;
        font-size: 18px;
        line-height: 1.4;
        resize: none;
        overflow: hidden;
      }

      .ai-prompt__button {
        width: 48px;
        height: 48px;
        flex: 0 0 48px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: #0063ce;
        color: #fff;
        cursor: pointer;
      }

      .ai-prompt__button:disabled {
        background: #e5e7eb;
        color: #6b7280;
        cursor: default;
      }

      .ai-prompt__button svg {
        width: 22px;
        height: 22px;
      }

      @media (max-width: 700px) {
        .ai-hero__title {
          font-size: 44px;
        }

        .ai-hero__description {
          font-size: 17px;
        }

        .ai-prompt {
          margin-top: 45px;
          padding-left: 18px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section class="ai-hero" aria-labelledby="ai-hero-title">
        <div class="ai-hero__content">
          <h1 class="ai-hero__title" id="ai-hero-title">
            We Build AI Solutions for the Enterprise
          </h1>

          <p class="ai-hero__description">
            Explore Successive services, industries, case studies, blogs,
            whitepapers and digital transformation capabilities.
          </p>

          <form class="ai-prompt" id="ai-search-form" role="search">
            <svg
              class="ai-prompt__sparkle"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M10.1 1.6c.3-.8 1.5-.8 1.8 0l1.3 3.5a8.8 8.8 0 0 0 5.2 5.2l3.5 1.3c.8.3.8 1.5 0 1.8l-3.5 1.3a8.8 8.8 0 0 0-5.2 5.2l-1.3 3.5c-.3.8-1.5.8-1.8 0l-1.3-3.5a8.8 8.8 0 0 0-5.2-5.2L.1 13.4c-.8-.3-.8-1.5 0-1.8l3.5-1.3a8.8 8.8 0 0 0 5.2-5.2l1.3-3.5Z"
              />
            </svg>

            <textarea
              class="ai-prompt__input"
              id="ai-search-gajendra"
              name="search"
              rows="1"
              aria-label="Ask Successive AI"
              placeholder="What can we solve for you?"
            ></textarea>

            <button
              class="ai-prompt__button"
              id="ai-search-button-gajendra"
              type="submit"
              aria-label="Send message"
              disabled
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M21 3 10.7 13.3M21 3l-6.4 18-3.9-7.7L3 9.4 21 3Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>

    <!--
      Paste only this script on the external website. Do not manually add
      successive-chat-widget-root; the widget creates it automatically.
    -->

    <script
      src="https://successive-chatbot-widget.vercel.app/successive-chat-widget.js"
      data-api-url="https://successive-chatbot-widget.vercel.app/api/chat"
      data-title="Ask Successive AI"
      data-welcome-message="Hi! How can I help you explore Successive?"
      data-primary-color="#0063ce"
      data-position="bottom-right"
      data-button-label="Chat with Successive"
      data-width="400"
      data-height="650"
      data-open-by-default="false"
      data-prompt-input-id="ai-search"
      data-prompt-button-id="ai-search-button"
      defer
    ></script>
  </body>
</html>
